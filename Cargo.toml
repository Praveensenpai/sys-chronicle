[package]
name = "sys-chronicle"
version = "0.5.0"
edition = "2021"
authors = ["Praveensenpai"]
description = "Timestamped system activity logger (apps, power, CPU/RAM) for AI analysis"

[[bin]]
name = "sys-chronicle"
path = "src/main.rs"

[[bin]]
name = "sys-chronicle-mal"
path = "src/bin/mal.rs"

[lib]
name = "sys_chronicle"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
dirs = "5.0"
ratatui = "0.26"
crossterm = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
url = "2.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

