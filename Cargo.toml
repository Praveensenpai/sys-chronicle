[package]
name = "sys-chronicle"
version = "0.1.6"
edition = "2021"
authors = ["Praveensenpai"]
description = "Timestamped system activity logger (apps, power, CPU/RAM) for AI analysis"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
dirs = "5.0"
ratatui = "0.26"
crossterm = "0.27"
