name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Upload Release Asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Binary
        run: |
          mkdir -p dist
          cp target/release/sys-chronicle dist/
          cd dist
          tar -czvf sys-chronicle-linux-x86_64.tar.gz sys-chronicle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sys-chronicle-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
